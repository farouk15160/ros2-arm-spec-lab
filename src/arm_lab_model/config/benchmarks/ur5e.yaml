limitations:
- No measured real-robot trajectory dataset bundled; hardware agreement cannot be
  claimed.
- Nominal kinematics lack per-robot calibration.
- Joint acceleration and guaranteed continuous torque limits unavailable.
- Inertials are upstream model values, not independently measured on this robot.
- Primitive collision geometry approximates envelopes and cannot establish hardware
  collision clearance.
- The manufacturer DH page approximates UR5e inertia as negligible; nonzero tensors
  here use ROS model estimates instead.
- Payload CoM, inertia, friction, motor/gear losses and controller settings require
  run-specific data.
